<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مرحباً بكم</title>
  <meta name="description" content="صفحة ترحيبية بسيطة مع زر تواصل عبر واتساب">
  <meta name="theme-color" content="#0b0b0d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0d;
      --bg-soft: #141417;
      --card: rgba(22, 22, 26, 0.72);
      --gold: #c9a24a;
      --gold-light: #e8cf8a;
      --gold-dark: #9a7a2e;
      --text: #f2ede3;
      --muted: #a8a196;
      --line: rgba(201, 162, 74, 0.28);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Tajawal", system-ui, sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse at top, rgba(201, 162, 74, 0.14), transparent 60%),
        radial-gradient(ellipse at bottom, rgba(201, 162, 74, 0.06), transparent 55%);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 620px;
      text-align: center;
      padding: 64px 48px 56px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      animation: rise 0.9s ease-out both;
    }

    /* زخرفة الزوايا */
    .card::before,
    .card::after {
      content: "";
      position: absolute;
      width: 42px;
      height: 42px;
      border: 1px solid var(--gold);
      opacity: 0.7;
    }
    .card::before { top: 14px; right: 14px; border-left: 0; border-bottom: 0; border-top-right-radius: 10px; }
    .card::after  { bottom: 14px; left: 14px; border-right: 0; border-top: 0; border-bottom-left-radius: 10px; }

    .emblem {
      width: 56px;
      height: 56px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--gold);
    }

    h1 {
      font-family: "Amiri", serif;
      font-weight: 700;
      font-size: clamp(2.6rem, 8vw, 4rem);
      line-height: 1.3;
      background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 55%, var(--gold-dark) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 22px auto 26px;
      color: var(--gold);
    }
    .divider span {
      width: 70px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }
    .divider span:last-child {
      background: linear-gradient(270deg, transparent, var(--gold));
    }

    p.about {
      font-size: clamp(1rem, 2.6vw, 1.15rem);
      font-weight: 300;
      color: var(--muted);
      max-width: 460px;
      margin: 0 auto 40px;
    }

    .btn-whatsapp {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 15px 34px;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      color: #1a1408;
      text-decoration: none;
      background: linear-gradient(135deg, var(--gold-light), var(--gold) 50%, var(--gold-dark));
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(201, 162, 74, 0.25);
      transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
    }
    .btn-whatsapp:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 38px rgba(201, 162, 74, 0.38);
      filter: brightness(1.05);
    }
    .btn-whatsapp:focus-visible {
      outline: 2px solid var(--gold-light);
      outline-offset: 4px;
    }
    .btn-whatsapp svg { width: 22px; height: 22px; flex-shrink: 0; }

    footer {
      margin-top: 40px;
      font-size: 0.85rem;
      color: rgba(168, 161, 150, 0.6);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
      .btn-whatsapp { transition: none; }
    }

    /* الجوال */
    @media (max-width: 480px) {
      .card { padding: 48px 22px 40px; border-radius: 16px; }
      .card::before, .card::after { width: 28px; height: 28px; }
      .btn-whatsapp { width: 100%; justify-content: center; padding: 15px 20px; }
      .divider span { width: 48px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="emblem" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8 5.8 21.3l2.4-7.4L2 9.4h7.6z"/></svg>
    </div>

    <h1>مرحباً بكم</h1>

    <div class="divider" aria-hidden="true">
      <span></span>
      <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><path d="M5 0l5 5-5 5-5-5z"/></svg>
      <span></span>
    </div>

    <p class="about">
      نسعد بزيارتكم ونحرص على تقديم تجربة راقية تليق بكم. نؤمن بأن التفاصيل الصغيرة تصنع الفرق،
      ولذلك نعمل بشغف واهتمام لنكون عند حسن ظنكم دائماً. تواصلوا معنا في أي وقت، ويسعدنا خدمتكم.
    </p>

    <a class="btn-whatsapp"
       href="https://wa.me/966500000000?text=%D8%A7%D9%84%D8%B3%D9%84%D8%A7%D9%85%20%D8%B9%D9%84%D9%8A%D9%83%D9%85"
       target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.64.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.08 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35zM12.05 21.8h-.01a9.8 9.8 0 0 1-5-1.37l-.36-.21-3.72.98 1-3.63-.24-.37a9.8 9.8 0 0 1-1.5-5.22c0-5.42 4.41-9.83 9.84-9.83 2.63 0 5.1 1.03 6.96 2.89a9.77 9.77 0 0 1 2.88 6.95c0 5.42-4.41 9.83-9.85 9.83zm8.38-18.2A11.76 11.76 0 0 0 12.05.13C5.5.13.17 5.46.17 12.01c0 2.1.55 4.14 1.59 5.94L.07 24l6.2-1.63a11.85 11.85 0 0 0 5.77 1.47h.01c6.54 0 11.87-5.33 11.87-11.88 0-3.17-1.24-6.16-3.49-8.4z"/></svg>
      تواصل معنا عبر واتساب
    </a>

    <footer>جميع الحقوق محفوظة ©</footer>
  </main>
</body>
</html>
